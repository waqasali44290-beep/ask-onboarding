server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Using a variable in proxy_pass makes nginx look the
    # backend up again (every 10s) instead of caching its IP forever, so a
    # restarted backend container doesn't cause 502 errors.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    # Forward API calls to the backend container (same origin -> no CORS issues in Docker)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_buffering off;          # required for streaming (SSE) answers
        proxy_read_timeout 300s;
    }

    # Single-page app: let React Router handle /chat, /upload, /tickets
    location / {
        try_files $uri /index.html;
    }
}
